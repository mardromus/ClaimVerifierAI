# docker compose run --rm setup   # one-off: download SciFact, build the index, train lite models, calibrate
# docker compose up app           # web UI + REST API on http://localhost:8000
x-common: &common
  build: .
  image: claimverifier
  environment:
    CLAIMVERIFIER_CONFIG: ${CLAIMVERIFIER_CONFIG:-configs/default.yaml}
    HF_TOKEN: ${HF_TOKEN:-}
    NCBI_API_KEY: ${NCBI_API_KEY:-}
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./models:/app/models
    - ./reports:/app/reports
    - hf-cache:/app/.cache/huggingface

services:
  setup:
    <<: *common
    profiles: ["setup"]
    command: sh -c "python -m claimverifier setup --config $${CLAIMVERIFIER_CONFIG}"
  app:
    <<: *common
    ports: ["8000:8000"]

volumes:
  hf-cache:
